name: PR345 bounded native-exit capture

on:
  push:
    branches: [diagnose/pr345-native-exit-c79466e8]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.repository == 'fswiderski/fesTerm'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      FESTERM_REQUIRE_WINDOWS_SYMLINKS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.x'
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: pr345-native-capture
      - name: Calibrate original exit, owned cleanup and validation-ID privacy
        run: python -m unittest discover -s scripts/tests -p test_windows_test_runner.py -v
      - name: Compare bounded bare and traced full-workspace app processes
        shell: pwsh
        run: .\scripts\capture-pr345-native-exit.ps1
      - name: Preserve bounded content-free metadata, including failures
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: pr345-native-exit-metadata
          path: target/pr345-native-capture/**/*.json
          if-no-files-found: warn
          retention-days: 7
